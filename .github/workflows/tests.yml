name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: php artisan test

  mysql:
    name: PHP 8.4 / MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plantcore_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci && npm run build
      - name: Exercise guarded transfer on disposable SQLite and MySQL
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_URL: ''
          DB_DATABASE: database/database.sqlite
          MIGRATION_DB_HOST: 127.0.0.1
          MIGRATION_DB_PORT: '3306'
          MIGRATION_DB_NAME: plantcore_ci
          MIGRATION_EXPECTED_DATABASE: plantcore_ci
          MIGRATION_DB_USER: root
          MIGRATION_DB_PASSWORD: root
          MIGRATION_BACKUP_CONFIRMED: 'yes'
          MIGRATION_ALLOW_WRITE: 'yes'
        run: |
          php -l scripts/sqlite-to-mysql.php
          touch database/database.sqlite
          php artisan migrate --database=sqlite --force
          php artisan db:seed --database=sqlite --class=LpaPortfolioSeeder --force
          php scripts/sqlite-to-mysql.php check
          php scripts/sqlite-to-mysql.php prepare
          php scripts/sqlite-to-mysql.php copy
          php scripts/sqlite-to-mysql.php verify
      - name: Run feature suite against disposable MySQL database
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: plantcore_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          cp .env.example .env
          php artisan config:clear
          php artisan migrate --force
          php artisan test
