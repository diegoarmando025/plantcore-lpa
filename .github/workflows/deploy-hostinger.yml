name: Deploy to Hostinger (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY LPA to authorize this release'
        required: true
        type: string
      database_backup:
        description: 'Type BACKUP CONFIRMED after taking a verified Traceability database backup'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lpa-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment shell syntax
        run: bash -n scripts/hostinger-deploy.sh
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: php artisan test
      - name: Assert Vite build exists
        run: test -s public/build/manifest.json
      - name: Package browser assets
        run: tar -czf "$RUNNER_TEMP/lpa-build.tgz" -C public build
      - uses: actions/upload-artifact@v4
        with:
          name: lpa-vite-${{ github.sha }}
          path: ${{ runner.temp }}/lpa-build.tgz
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Explicit release gates
        env:
          CONFIRM: ${{ inputs.confirmation }}
          BACKUP: ${{ inputs.database_backup }}
        run: |
          test "$CONFIRM" = 'DEPLOY LPA'
          test "$BACKUP" = 'BACKUP CONFIRMED'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lpa-vite-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-assets
      - name: Configure pinned SSH host verification
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$SSH_HOST_KEYS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Transfer compiled assets and deploy exact commit
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          SHA: ${{ github.sha }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing Hostinger host}"
          : "${SSH_USER:?Missing Hostinger SSH user}"
          PORT="${SSH_PORT:-65002}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          REMOTE="/home/u641948971/domains/devalejandre.com/apps/lpa/storage/app/deploy-input-${SHA}.tgz"
          OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519")
          scp "${OPTS[@]}" -P "$PORT" "$TEMP/deploy-assets/lpa-build.tgz" "$SSH_USER@$SSH_HOST:$REMOTE"
          ssh "${OPTS[@]}" -p "$PORT" "$SSH_USER@$SSH_HOST" "bash -s -- lpa '$SHA' '$REMOTE'" < scripts/hostinger-deploy.sh
